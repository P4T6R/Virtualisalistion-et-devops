# Exécute les tests locaux (tests/README.md) à chaque push et pull request.
# Aucune VM n'est démarrée : les preuves VirtualBox restent dans results.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Syntaxe Ruby de l'inventaire et du Vagrantfile
        run: |
          ruby -c Vagrantfile
          ruby -c config/topology.rb
      - name: Installer les dépendances de test
        run: pip install -r tests/requirements.txt
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
